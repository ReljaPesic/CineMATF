services:
  postgres:
    image: postgres:16
    container_name: postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    restart: unless-stopped
    networks:
      - cinema-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 15

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=cine.matf@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=admin1234
    restart: always
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/root/.pgadmin
    networks:
      - cinema-network

  moviedb:
    image: mongo:7
    container_name: moviedb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    restart: unless-stopped
    networks:
      - cinema-network

  cinemaapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinemaapi
    env_file:
      - .env
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=cinemadb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cinema-network

  movieapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movieapi
    ports:
      - "8001:8080"
    depends_on:
      - moviedb
    restart: unless-stopped
    networks:
      - cinema-network

  reservationapi:
    build:
      context: .
      dockerfile: Services/Reservation.API/Dockerfile
    container_name: reservationapi
    env_file:
      - .env
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=ReservationServiceDb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Development
      - CinemaApi__BaseUrl=http://cinemaapi:8080
      - ScreeningApi__BaseUrl=http://screeningapi:8081
      - MovieApi__BaseUrl=http://movieapi:8080
    ports:
      - "8002:8080"
    depends_on:
      postgres:
        condition: service_healthy
      cinemaapi:
        condition: service_started
      screeningapi:
        condition: service_started
      movieapi:
        condition: service_started
    restart: unless-stopped
    networks:
      - cinema-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  screeningapi:
    build:
      context: .
      dockerfile: Services/Screening.API/Dockerfile
    container_name: screeningapi
    env_file:
      - .env
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=ScreeningDB;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8003:8080"
      - "8004:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cinema-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  identityapi:
    build:
      context: .
      dockerfile: Services/Identity.API/Dockerfile
    container_name: identityapi
    env_file:
      - .env
    environment:
      - ConnectionStrings__IdentityConnectionString=Host=postgres;Port=5432;Database=IdentityDB;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8005:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cinema-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  webapp:
    build:
      context: ./WebApp
      dockerfile: Dockerfile
    container_name: webapp
    ports:
      - "4200:4200"
    depends_on:
      - cinemaapi
      - movieapi
      - screeningapi
      - reservationapi
      - identityapi
    restart: unless-stopped
    networks:
      - cinema-network

networks:
  cinema-network:
    driver: bridge

volumes:
  pgdata:
  pgadmin_data:
  mongodata:
