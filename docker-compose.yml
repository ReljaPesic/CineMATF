services:
  cinemadb:
    image: postgres:16
    container_name: cinemadb
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - cinema-network

  reservationdb:
    image: postgres:16
    container_name: reservationdb
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${RESERVATION_DB_NAME}
      POSTGRES_USER: ${RESERVATION_DB_USER}
      POSTGRES_PASSWORD: ${RESERVATION_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - reservationpgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - cinema-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=cine.matf@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=admin1234
    restart: always
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/root/.pgadmin
    networks:
      - cinema-network

  cinemaapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinemaapi
    env_file:
      - .env
    environment:
      - ConnectionStrings__Default=Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USERNAME};Password=${DB_PASSWORD}
    depends_on:
      - cinemadb
    restart: unless-stopped
    networks:
      - cinema-network

  moviedb:
    image: mongo:7
    container_name: moviedb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    restart: unless-stopped
    networks:
      - cinema-network

  movieapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movieapi
    ports:
      - "8001:8080"
    depends_on:
      - moviedb
    restart: unless-stopped
    networks:
      - cinema-network

  screeningdb:
    image: postgres:16
    container_name: screeningdb
    environment:
      POSTGRES_DB: ScreeningDB
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - screeningpgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - cinema-network

  reservationapi:
    build:
      context: .
      dockerfile: Services/Reservation.API/Dockerfile
    container_name: reservationapi
    env_file:
      - .env
    environment:
      - ConnectionStrings__Default=Host=${RESERVATION_DB_HOST};Port=${RESERVATION_DB_PORT};Database=${RESERVATION_DB_NAME};Username=${RESERVATION_DB_USER};Password=${RESERVATION_DB_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Development
      - CinemaApi__BaseUrl=http://cinemaapi:8080
      - ScreeningApi__BaseUrl=http://screeningapi:8081
    ports:
      - "8002:8080"
    depends_on:
      - reservationdb
      - cinemaapi
      - screeningapi
    restart: unless-stopped
    networks:
      - cinema-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  screeningapi:
    build:
      context: .
      dockerfile: Services/Screening.API/Dockerfile
    container_name: screeningapi
    env_file:
      - .env
    environment:
      - ConnectionStrings__Default=Host=screeningdb;Port=5432;Database=ScreeningDB;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8003:8080"
      - "8004:8081"
    depends_on:
      - screeningdb
    restart: unless-stopped
    networks:
      - cinema-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  cinema-network:
    driver: bridge

volumes:
  pgdata:
  pgadmin_data:
  mongodata:
  screeningpgdata:
  reservationpgdata:
