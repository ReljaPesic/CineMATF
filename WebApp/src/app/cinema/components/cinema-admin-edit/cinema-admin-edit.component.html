<section class="cinema-admin-edit">
  <a class="back" (click)="cancel()">‹ Cancel</a>

  <h1>Edit cinema admin</h1>

  @if (loading) {
    <p class="status">Loading…</p>
  } @else if (notFound) {
    <p class="status status--error">That cinema admin doesn't exist.</p>
  } @else {
    <p class="cinema-admin-edit__username">{{ username }}</p>

    @if (error) {
      <p class="status status--error">{{ error }}</p>
    }

    <div class="field">
      <label>Cinemas this admin manages</label>
      @if (cinemas.length === 0) {
        <p class="status">No cinemas found.</p>
      } @else {
        <div class="cinema-picker">
          @for (cinema of cinemas; track cinema.id) {
            <label class="cinema-picker__item">
              <input
                type="checkbox"
                [checked]="selectedCinemaIds.has(cinema.id)"
                (change)="toggleCinema(cinema.id, $any($event.target).checked)"
              />
              <span class="cinema-picker__name">{{ cinema.name }}</span>
              <span class="cinema-picker__city">{{ cinema.city }}</span>
            </label>
          }
        </div>
      }
    </div>

    <div class="actions">
      <button type="button" class="btn btn--primary" [disabled]="saving" (click)="submit()">
        {{ saving ? 'Saving…' : 'Save changes' }}
      </button>
      <button type="button" class="btn" (click)="cancel()">Cancel</button>
    </div>
  }
</section>
