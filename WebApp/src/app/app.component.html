<header class="app-header">
  <span class="app-header__brand">{{ title }}</span>
  <nav class="app-header__nav">
    <a routerLink="/screenings" routerLinkActive="active">Screenings</a>
    <a routerLink="/movies" routerLinkActive="active">Movies</a>
    @if (isAdmin()) {
      <a routerLink="/cinemas" routerLinkActive="active">Cinemas</a>
      <a routerLink="/reservations" routerLinkActive="active">Reservations</a>
    }
  </nav>

  <div class="app-header__auth">
    @if (isLoggedIn()) {
      <a class="app-header__user" routerLink="/profile" routerLinkActive="active">{{ user()!.username }}</a>
      <button type="button" class="link-btn" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Log in</a>
      <a routerLink="/register" routerLinkActive="active">Sign up</a>
    }
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>
